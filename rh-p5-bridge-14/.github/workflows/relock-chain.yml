name: Chain Re-lock (Opera Numerorum)

# Runs weekly on Monday at 06:00 UTC, and on demand.
# When one or more ensemble repos have received new commits since the last
# lock, the workflow patches CHAIN.md / REPOS.md and opens a pull request.

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print new SHA but do not create a PR)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write      # push the relock branch
  pull-requests: write # open the PR

jobs:
  relock:
    name: "Recompute & re-lock ensemble chain"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rh-p5-bridge-14
        uses: actions/checkout@v4
        with:
          # Full history so we can push a branch and open a PR
          fetch-depth: 0

      - name: Set up Python (for SHA recomputation)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run relock script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/relock-chain.sh
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            bash scripts/relock-chain.sh --dry-run
          else
            bash scripts/relock-chain.sh
          fi
