name: ZeroBeacon.ai — 1052 Tools
description: >
  1052 beacon-anchored MCP tools across 4 groups: Market Router (tools 1–300),
  Math Engine (tools 301–700), Amplum Everyday (tools 701–1000), and the Brain
  Router — 1 brain that routes the full catalog plus 49
  meta-tools for chain, think, swarm, and consensus operations.

  The beacon fingerprint (d=2303582338 · beacon=1d2c7a5b · ω²=48/13>0) is
  collision-anchored in every tool response and verifiable on-chain via 9
  controlled collisions pinned to the P1/P2 anchor pair.

  Tiers (pass X-API-Key header after Stripe checkout at https://zerobeacon.ai):
    FREE      — 102 tools, no API key required
    PRO       — 402 tools, $10/month
    PRO+      — 802 tools, $100/month
    ENTERPRISE — all 1052 tools, $1,000/research

  Note: this listing covers the commerce router product only.
  The Opera Numerorum research lab (Lean 4 brothers-desert-proof and Clay
  Millennium formalization) lives at github.com/DavidFox998/zerobeacon and
  is not part of the Smithery tool offering.

version: "1052.0.0"

configSchema:
  type: object
  properties:
    apiKey:
      type: string
      description: "API key from https://zerobeacon.ai after Stripe checkout (passed as X-API-Key header). Leave blank for the 102-tool FREE tier."
      title: "X-API-Key"
      x-from:
        header: x-api-key
      x-to:
        header: X-API-Key
  required: []

startCommand:
  type: http
  url: https://zerobeacon.ai/mcp

tools:
  count: 1052

tags:
  - beacon
  - math
  - payments
  - escrow
  - arakelov
  - riemann
  - brain-router
  - mcp

license: proprietary
