name: ZeroBeacon.ai — 1052 Tools
description: >
  1052 MCP operations across four groups: Market Router (MF-01–06), Math
  Engine (MF-07–14), Amplum Everyday (MF-15–20), and Brain Router (MF-21).
  Start with the FREE mf_01_beacon operation to verify connectivity, then use
  each operation's purpose and input schema to select a workflow.

  Tiers (pass X-API-Key header after Stripe checkout at https://zerobeacon.ai):
    FREE      — 102 tools, no API key required
    PRO       — 402 tools, $10/month
    PRO+      — 802 tools, $100/month
    ENTERPRISE — all 1052 tools, $1,000/research

  Note: this listing covers the commerce router product only.
  The Opera Numerorum research lab (Lean 4 brothers-desert-proof and Clay
  Millennium formalization) lives at github.com/DavidFox998/zerobeacon and
  is not part of the Smithery tool offering.

version: "1052.1.1"

configSchema:
  type: object
  properties:
    apiKey:
      type: string
      description: "Optional API key from https://zerobeacon.ai. Leave blank for the 102-operation FREE tier."
      title: "X-API-Key"
      x-from:
        header: x-api-key
      x-to:
        header: X-API-Key
  required: []

startCommand:
  type: http
  url: https://zerobeacon.ai/mcp

tools:
  count: 1052

tags:
  - beacon
  - math
  - payments
  - escrow
  - arakelov
  - riemann
  - brain-router
  - mcp

license: proprietary
