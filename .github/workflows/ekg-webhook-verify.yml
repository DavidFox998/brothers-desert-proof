name: EKG Webhook Alert Verification

# One-shot workflow to confirm the on-failure webhook alert fires correctly.
# Trigger manually (workflow_dispatch); delete this file and
# tests/test_ekg_webhook_verify.py once verification is confirmed.
#
# What it checks:
#   1. A forced-failure test causes the job to fail.
#   2. The alert step fires — builds and delivers the text+blocks/mrkdwn payload
#      to a local Python HTTP server (no external service dependency).
#   3. A second job confirms the no-op path exits 0 when the URL is empty —
#      matching the production ekg-coldstart-beat-rate and heartbeat-ekg-smoke behaviour.

on:
  workflow_dispatch:

jobs:
  # ── Job 1: forced failure → webhook fires to local test server ────────────
  ekg-alert-fires-on-failure:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest

      - name: Run forced-failure test (expected to fail)
        # This step is expected to fail; the alert step below runs when it does.
        run: pytest tests/test_ekg_webhook_verify.py -v

      - name: Fire webhook alert on failure
        if: failure()
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build the same payload shape used by the production ekg-coldstart-beat-rate alert:
          # top-level "text" string + "blocks" array with a mrkdwn section.
          PAYLOAD=$(jq -nc \
            --arg ref  "$REF_NAME" \
            --arg url  "$RUN_URL" \
            --arg ts   "$TIMESTAMP" \
            '{
              "text": ":rotating_light: *EKG webhook alert verification — FIRED CORRECTLY*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": (":rotating_light: *EKG webhook alert verification — FIRED CORRECTLY*\n*Workflow:* `ekg-alert-fires-on-failure`\n*Ref:* `" + $ref + "`\n*Time:* `" + $ts + "`\n*Run:* " + $url + "\n\nTriggered intentionally to verify the on-failure webhook path works end-to-end.")
                  }
                }
              ]
            }')

          echo "=== Constructed payload ==="
          echo "$PAYLOAD" | jq .
          echo ""

          # ── Validate payload JSON structure ───────────────────────────────
          # Confirm top-level "text" field exists (required by all alert consumers).
          TEXT_FIELD=$(echo "$PAYLOAD" | jq -r '.text')
          if [ -z "$TEXT_FIELD" ] || [ "$TEXT_FIELD" = "null" ]; then
            echo "ERROR: payload is missing top-level .text field"
            exit 1
          fi

          # Confirm blocks array with mrkdwn section is present.
          BLOCK_TYPE=$(echo "$PAYLOAD" | jq -r '.blocks[0].text.type')
          if [ "$BLOCK_TYPE" != "mrkdwn" ]; then
            echo "ERROR: blocks[0].text.type is '${BLOCK_TYPE}', expected 'mrkdwn'"
            exit 1
          fi
          echo "Payload structure validated: text + blocks[mrkdwn] ✓"
          echo ""

          # ── Deliver to a local Python HTTP server ─────────────────────────
          # Start a minimal one-shot HTTP server that records the first request.
          python3 - <<'PYEOF' &
          import http.server, json, sys, os

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(length).decode()
                  data = json.loads(body)
                  print("=== Webhook received ===", flush=True)
                  print(json.dumps(data, indent=2), flush=True)
                  # Validate shape
                  assert "text" in data, "Missing 'text' field"
                  assert "blocks" in data, "Missing 'blocks' field"
                  assert data["blocks"][0]["text"]["type"] == "mrkdwn", "Not mrkdwn"
                  print("Shape OK: text + blocks[mrkdwn] ✓", flush=True)
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"ok")
              def log_message(self, *a): pass  # silence access log

          httpd = http.server.HTTPServer(("127.0.0.1", 9876), Handler)
          print("Test server listening on :9876", flush=True)
          httpd.handle_request()  # serve one request then exit
          PYEOF

          SERVER_PID=$!
          sleep 1  # let server start

          # POST the payload exactly as the production alert step does.
          echo "=== Firing alert to local test server (http://127.0.0.1:9876) ==="
          HTTP_STATUS=$(curl -s -o /tmp/webhook_response.txt -w "%{http_code}" \
            -X POST "http://127.0.0.1:9876" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          RESPONSE=$(cat /tmp/webhook_response.txt)
          echo "curl exit code: $?"
          echo "HTTP status: $HTTP_STATUS"
          echo "Server response: $RESPONSE"

          wait "$SERVER_PID"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: test server returned HTTP ${HTTP_STATUS}"
            exit 1
          fi

          echo ""
          echo "=== Verification complete ==="
          echo "  ✓ Forced-failure test triggered the on-failure step"
          echo "  ✓ Payload built: text + blocks[mrkdwn] (matches production format)"
          echo "  ✓ curl delivered payload to endpoint — HTTP 200"
          echo "  ✓ Server confirmed payload shape is correct"

  # ── Job 2: empty URL → no-op, exit 0 ─────────────────────────────────────
  ekg-alert-noop-when-no-url:
    runs-on: ubuntu-latest

    steps:
      - name: "No-op: ALERT_WEBHOOK_URL empty (matches ekg-coldstart-beat-rate)"
        env:
          ALERT_WEBHOOK_URL: ""
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "[ekg-coldstart-alert] ALERT_WEBHOOK_URL not configured — skipping"
            exit 0
          fi
          echo "ERROR: expected no-op but ALERT_WEBHOOK_URL was set"; exit 1

      - name: "No-op: SLACK_WEBHOOK_URL empty (matches heartbeat-ekg-smoke)"
        env:
          SLACK_WEBHOOK_URL: ""
          REF_NAME: "test-ref"
          RUN_ID: "0"
          REPOSITORY: "owner/repo"
        run: |
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "ERROR: URL was set — expected empty"; exit 1
          fi
          echo "SLACK_WEBHOOK_URL is not set — skipping webhook notification"
          echo "Failing run: $RUN_URL"
          echo "SUCCESS: no-op confirmed (exit 0)"
