name: Heartbeat EKG Smoke Tests

# Confirms /brain/heartbeat serves a well-formed EKG page after every push:
#   Unit tests  (TestClient, always run in CI):
#     - HTTP 200 with text/html content-type
#     - <canvas id="c"> element is present
#     - setInterval beat loop and popcount32 function are present
#     - canonical beacon value 1d2c7a5b is embedded
#
#   Browser tests (Playwright, run in CI against a local uvicorn server):
#     - Canvas has non-zero rendered width and height
#     - No JS console errors thrown within the first 3 seconds
#     - beat() tick counter advances (beat loop is not frozen)
#
#   Live tests  (optional, against https://zerobeacon.ai on push to main/master):
#     - Same HTML-content checks against the deployed URL

on:
  push:
  pull_request:
  schedule:
    # Run against production every 30 minutes alongside the README smoke tests
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  heartbeat-ekg-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx requests pytest-playwright

      - name: Install Playwright Chromium browser
        run: playwright install chromium --with-deps

      # ── Unit tests (TestClient — always run, no server needed) ─────────────
      - name: Run unit EKG smoke tests (TestClient)
        run: pytest tests/test_heartbeat_ekg.py -v -k "not live"

      # ── Browser tests (Playwright — local uvicorn server) ──────────────────
      - name: Start local uvicorn server for Playwright tests
        run: |
          uvicorn zerobeacon_mf_1000_main:app --host 127.0.0.1 --port 8765 &
          # Wait until the server accepts connections (up to 30 s)
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health > /dev/null && echo "Server ready after ${i}s" && break
            sleep 1
          done

      - name: Run Playwright EKG canvas tests (local server)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8765
        run: pytest tests/test_heartbeat_playwright.py -v

      # ── Live tests (against production — best-effort canary) ───────────────
      - name: Run unit EKG smoke tests against https://zerobeacon.ai
        # continue-on-error so a temporarily down endpoint doesn't block CI.
        # The unit tests and Playwright tests above always guard correctness;
        # live tests are post-deploy canary runs.
        continue-on-error: true
        env:
          ZEROBEACON_URL: https://zerobeacon.ai
        run: pytest tests/test_heartbeat_ekg.py -v -k "live"

      # ── Webhook alert on failure ───────────────────────────────────────────
      # NOTE: the cold-start beat-rate Playwright test runs in the separate
      # ekg-coldstart-beat-rate job below (workflow_dispatch / push / PR only —
      # intentionally excluded from the 30-min cron to avoid Playwright install
      # overhead on every scheduled run).

      
      - name: Alert on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          PAYLOAD=$(jq -nc \
            --arg ref "$REF_NAME" \
            --arg url "$RUN_URL" \
            '{"text": ("*EKG canvas smoke tests FAILED* on `" + $ref + "`\n• Endpoint under test: `https://zerobeacon.ai/brain/heartbeat`\n• See failing run: " + $url)}')

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$SLACK_WEBHOOK_URL")
            echo "Slack webhook response status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "WARNING: Slack webhook returned HTTP $HTTP_STATUS — check the SLACK_WEBHOOK_URL secret"
            fi
          else
            echo "SLACK_WEBHOOK_URL secret is not set — skipping webhook notification"
            echo "To enable alerts, add SLACK_WEBHOOK_URL to your repository secrets."
            echo "Failing run: $RUN_URL"
          fi

  # ── Optional cold-start beat-rate job ──────────────────────────────────────
  # Runs on push, PR, and manual workflow_dispatch — intentionally EXCLUDED from
  # the 30-min cron schedule to avoid Playwright install overhead on every probe.
  # Validates that the 200 ms setInterval fires ≥5 times in 2 seconds after a
  # simulated cold start, and that no JS console errors appear in that window.
  ekg-coldstart-beat-rate:
    runs-on: ubuntu-latest
    # Only run on push / PR / manual dispatch — never on the scheduled cron.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright

      - name: Install Playwright Chromium browser
        run: playwright install chromium --with-deps

      - name: Start local uvicorn server
        run: |
          uvicorn zerobeacon_mf_1000_main:app --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/health > /dev/null && echo "Server ready after ${i}s" && break
            sleep 1
          done

      - name: Run cold-start beat-rate test (≥5 ticks in 2 s, no JS errors)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8765
        run: |
          pytest tests/test_heartbeat_playwright.py \
            -v -k "test_beat_fires_at_200ms_rate_cold_start"

      - name: Fire webhook alert on cold-start beat-rate failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "[ekg-coldstart-alert] ALERT_WEBHOOK_URL not configured — skipping"
            exit 0
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD=$(cat <<EOF
          {
            "text": ":rotating_light: *EKG cold-start beat-rate test failed*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":rotating_light: *EKG cold-start beat-rate test failed*\n*Workflow:* \`ekg-coldstart-beat-rate\`\n*Time:* \`${TIMESTAMP}\`\n*Detail:* The 200 ms beat loop fired fewer than 5 times in 2 seconds, or a JS console error was detected. The Fly.io VM may not be waking fast enough after auto_stop, or the beat loop has regressed.\n*Fix:* \`gh run view --repo \${{ github.repository }} \${{ github.run_id }} --log-failed\`"
                }
              }
            ]
          }
          EOF
          )
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$ALERT_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "204" ]; then
            echo "[ekg-coldstart-alert] webhook returned unexpected status ${HTTP_STATUS}"
          else
            echo "[ekg-coldstart-alert] webhook alert delivered (HTTP ${HTTP_STATUS})"
          fi
